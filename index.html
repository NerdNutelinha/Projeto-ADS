<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jokenpô - Pedra, Papel e Tesoura</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <p class="tag">JOGO INTERATIVO</p>
            <h1>Pedra, Papel e Tesoura</h1>
            <p class="subtitulo">
                Escolha sua jogada e desafie a maquina.
            </p>
        </header>

        <section class="placar">
            <div class="pontos">
                <span>Você</span>
                <strong id="pontosJogador">0</strong>
            </div>

            <div class="separador">×</div>

            <div class="pontos">
                <span>Maquina</span>
                <strong id="pontosComputador">0</strong>
            </div>
        </section>

        <section class="jogadas">

            <button class="opcao" data-escolha="pedra">
                <span class="emoji">✊</span>
                <span>Pedra</span>
            </button>

            <button class="opcao" data-escolha="papel">
                <span class="emoji">✋</span>
                <span>Papel</span>
            </button>

            <button class="opcao" data-escolha="tesoura">
                <span class="emoji">✌️</span>
                <span>Tesoura</span>
            </button>

        </section>

        <section id="resultado" class="resultado" aria-live="polite">
            Escolha uma opção para começar!
        </section>

        <section id="detalhes" class="detalhes">
            O resultado aparecerá aqui.
        </section>

        <button id="reiniciar" class="reiniciar">
            Reiniciar jogo
        </button>

        <footer>
            Feito com HTML, CSS e JavaScript
        </footer>

    </main>

    <script src="script.js"></script>

</body>

</html>
